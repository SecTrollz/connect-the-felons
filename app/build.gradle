plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ctf.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.ctf.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            // Pixel 9a is arm64-v8a only. If you also want emulator support add "x86_64".
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        // All five are pure-Python (no C extensions) - install cleanly on arm64
        pip {
            install "dnspython"
            install "python-whois"
            install "networkx"
            install "python-dateutil"
            install "requests"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
