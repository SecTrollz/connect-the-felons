name: Build CTF APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you trigger manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64 Ubuntu - Android SDK runs fine here

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle   # caches ~/.gradle between runs - second build is fast

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTF-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30   # artifact stays downloadable for 30 days
